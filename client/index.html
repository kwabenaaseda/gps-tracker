<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark Tracker - Multi-Color Devices</title>

<!-- Preconnect to tile and asset CDNs for reduced latency -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://basemaps.cartocdn.com">
<link rel="preconnect" href="https://server.arcgisonline.com">

<!-- Leaflet 2D CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MapLibre GL 3D CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- Fonts & Tailwind -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        fontFamily: { sans: ["Inter", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
        colors: {
          indigo: { DEFAULT: "#4C5FD5", dark: "#6474E0" },
          panel: { light: "#FFFFFF", dark: "#12151C" },
          page: { light: "#F4F5F7", dark: "#0B0D12" },
          hairline: { light: "#E7E9EE", dark: "#252B38" },
        }
      }
    }
  }
</script>

<style>
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  .map-container { position: absolute; inset: 0; width: 100%; height: 100%; }

  .leaflet-control-zoom { border: none !important; box-shadow: 0 1px 6px rgba(0,0,0,0.12) !important; }
  .leaflet-control-zoom a { border: none !important; }
  .leaflet-control-attribution { font-size: 10px !important; }

  /* --- Hovering 3D Pin Styles --- */
  .hover-pin-wrapper {
    position: relative;
    width: 44px;
    height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    pointer-events: auto;
    cursor: pointer;
  }

  .pin-floating-head {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: linear-gradient(135deg, var(--pin-color-light) 0%, var(--pin-color) 100%);
    box-shadow: 0 6px 16px var(--pin-shadow);
    border: 2px solid #FFFFFF;
    animation: floatBob 2.4s ease-in-out infinite;
    z-index: 2;
  }

  .pin-floating-head svg {
    transform: rotate(45deg);
    width: 18px;
    height: 18px;
    color: #FFFFFF;
  }

  .pin-tether {
    width: 2px;
    height: 22px;
    background: linear-gradient(to bottom, var(--pin-color) 0%, rgba(255, 255, 255, 0) 100%);
    animation: tetherPulse 2.4s ease-in-out infinite;
    z-index: 1;
  }

  .pin-ground-shadow {
    width: 20px;
    height: 6px;
    background: rgba(18, 21, 28, 0.35);
    border-radius: 50%;
    animation: shadowScale 2.4s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes floatBob {
    0%, 100% { transform: translateY(0px) rotate(-45deg); }
    50% { transform: translateY(-12px) rotate(-45deg); }
  }

  @keyframes tetherPulse {
    0%, 100% { opacity: 0.8; height: 22px; }
    50% { opacity: 0.4; height: 34px; }
  }

  @keyframes shadowScale {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(0.5); opacity: 0.15; }
  }

  .dark .pin-ground-shadow {
    background: var(--pin-shadow);
    filter: blur(1px);
  }

  /* Small color swatch tag shown next to the pin head, helps disambiguate
     overlapping/near-identical-coordinate devices at a glance */
  .pin-label {
    position: absolute;
    top: -4px;
    left: 46px;
    white-space: nowrap;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--pin-color);
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
    pointer-events: none;
  }
  .hover-pin-wrapper:hover .pin-label {
    opacity: 1;
    transform: translateX(0);
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
  .dark ::-webkit-scrollbar-thumb { background: #252B38; }

  @keyframes blink { 50% { opacity: 0.35; } }
  .blink { animation: blink 1s ease-in-out infinite; }

  .layer-btn {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    font-size: 12px; font-weight: 500; color: #4B5563;
    transition: background 0.15s ease, color 0.15s ease; cursor: pointer;
  }
  .layer-btn:hover { background: #F3F4F6; color: #111318; }
  .layer-btn.active { background: #EEF0F4; color: #4C5FD5; }
  .dark .layer-btn { color: #9CA3AF; }
  .dark .layer-btn:hover { background: #1A1E26; color: #E7E9EE; }
  .dark .layer-btn.active { background: #1E242E; color: #6474E0; }
  .layer-btn svg { flex-shrink: 0; }
</style>
</head>
<body class="font-sans bg-page-light dark:bg-page-dark text-[#111320] dark:text-[#E7E9EE]">

<!-- Dual Map Containers -->
<div id="map2d" class="map-container"></div>
<div id="map3d" class="map-container hidden"></div>

<!-- Telemetry panel -->
<div class="absolute top-4 left-4 z-[1000] w-[300px] bg-panel-light dark:bg-panel-dark border border-hairline-light dark:border-hairline-dark rounded-xl shadow-lg shadow-black/5 dark:shadow-black/40 overflow-hidden">
  <div class="flex items-center justify-between px-4 py-3.5 border-b border-hairline-light dark:border-hairline-dark">
    <div>
      <div class="text-[13px] font-semibold tracking-tight">Spark tracker</div>
      <div class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">Live position feed</div>
    </div>
    <div id="statusPill" class="flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full border border-hairline-light dark:border-hairline-dark text-gray-400">
      <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-gray-400 blink"></span>
      <span id="statusText">Connecting</span>
    </div>
  </div>
  <div id="deviceList" class="max-h-[42vh] overflow-y-auto">
    <div id="emptyState" class="px-4 py-7 text-center text-[12px] text-gray-400 dark:text-gray-500 leading-relaxed">
      Waiting for the first location report&hellip;
    </div>
  </div>
</div>

<!-- Controls -->
<button id="themeToggle" aria-label="Toggle dark mode"
  class="absolute top-4 right-4 z-[1000] w-9 h-9 flex items-center justify-center rounded-full bg-panel-light dark:bg-panel-dark border border-hairline-light dark:border-hairline-dark shadow-lg shadow-black/5 dark:shadow-black/40 text-gray-500 dark:text-gray-300 hover:text-indigo dark:hover:text-indigo-dark transition-colors">
  <svg id="iconSun" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg id="iconMoon" class="w-[18px] h-[18px] hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
</button>

<button id="locateBtn" aria-label="Share my location"
  class="absolute top-16 right-4 z-[1000] w-9 h-9 flex items-center justify-center rounded-full bg-panel-light dark:bg-panel-dark border border-hairline-light dark:border-hairline-dark shadow-lg shadow-black/5 dark:shadow-black/40 text-gray-500 dark:text-gray-300 hover:text-blue-500 transition-colors">
  <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<!-- Layer Selector -->
<div id="layerControl" class="absolute bottom-6 right-4 z-[1000] flex flex-col rounded-xl shadow-lg shadow-black/10 dark:shadow-black/40 overflow-hidden border border-hairline-light dark:border-hairline-dark bg-panel-light dark:bg-panel-dark">
  <button data-layer="roadmap" class="layer-btn active" aria-pressed="true">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>
    Roadmap
  </button>
  <button data-layer="landscape" class="layer-btn" aria-pressed="false">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 8 5-5 5 15H2L8 3z"/></svg>
    Landscape
  </button>
  <button data-layer="realism" class="layer-btn" aria-pressed="false">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
    Realism
  </button>
  <button data-layer="3d" class="layer-btn" aria-pressed="false">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
    3D Terrain
  </button>
</div>

<script>
  // Configuration
  const WS_URL = `ws://${location.hostname || "localhost"}:3001/ws`;
  const API_URL = `http://${location.hostname || "localhost"}:3001/api/locations`;
  const RECONNECT_BASE_MS = 1000;
  const RECONNECT_MAX_MS = 15000;

  // Base Layers Definitions
  const BASE_LAYERS = {
    roadmap: {
      light: { url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", attribution: '&copy; OpenStreetMap &copy; CARTO' },
      dark:  { url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", attribution: '&copy; OpenStreetMap &copy; CARTO' }
    },
    landscape: {
      url: "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
      attribution: '&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)',
      subdomains: "abc", maxZoom: 17
    },
    realism: {
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
      maxZoom: 19
    }
  };

  // Global State Variables
  const root = document.documentElement;
  let isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  let currentBaseLayer = "roadmap";
  let is3DActive = false;

  // Initialize 2D Leaflet Map
  const leafletMap = L.map("map2d", {
    zoomControl: true,
    attributionControl: true,
    preferCanvas: true,
    updateWhenIdle: true
  }).setView([7.3349, -2.3123], 13);

  let activeTileLayer = null;

  function set2DTileLayer() {
    if (activeTileLayer) leafletMap.removeLayer(activeTileLayer);

    let config = currentBaseLayer === "roadmap"
      ? BASE_LAYERS.roadmap[isDark ? "dark" : "light"]
      : BASE_LAYERS[currentBaseLayer];

    activeTileLayer = L.tileLayer(config.url, {
      attribution: config.attribution,
      subdomains: config.subdomains || "abcd",
      maxZoom: config.maxZoom || 19
    }).addTo(leafletMap);
  }
  set2DTileLayer();

  // Initialize 3D MapLibre Map
  const maplibreMap = new maplibregl.Map({
    container: "map3d",
    style: {
      version: 8,
      sources: {
        'osm-tiles': {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        },
        'terrain-dem': {
          type: 'raster-dem',
          tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
          tileSize: 256,
          encoding: 'terrarium',
          maxzoom: 15
        }
      },
      layers: [
        { id: 'osm-layer', type: 'raster', source: 'osm-tiles', minzoom: 0, maxzoom: 19 }
      ],
      terrain: { source: 'terrain-dem', exaggeration: 1.5 }
    },
    center: [-2.3123, 7.3349],
    zoom: 13,
    pitch: 60,
    bearing: -17.6
  });

  // Theme Sync
  function applyTheme() {
    root.classList.toggle("dark", isDark);
    document.getElementById("iconSun").classList.toggle("hidden", isDark);
    document.getElementById("iconMoon").classList.toggle("hidden", !isDark);
    if (!is3DActive && currentBaseLayer === "roadmap") set2DTileLayer();
  }
  applyTheme();

  document.getElementById("themeToggle").addEventListener("click", () => {
    isDark = !isDark;
    applyTheme();
  });

  // Seamless Layer Switcher
  document.querySelectorAll(".layer-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const selected = btn.dataset.layer;

      document.querySelectorAll(".layer-btn").forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");

      if (selected === "3d") {
        if (!is3DActive) {
          const center = leafletMap.getCenter();
          const zoom = leafletMap.getZoom();

          document.getElementById("map2d").classList.add("hidden");
          document.getElementById("map3d").classList.remove("hidden");

          maplibreMap.resize();
          maplibreMap.jumpTo({ center: [center.lng, center.lat], zoom: zoom - 1 });
          is3DActive = true;
          sync3DMarkers();
        }
      } else {
        if (is3DActive) {
          const center = maplibreMap.getCenter();
          const zoom = maplibreMap.getZoom();

          document.getElementById("map3d").classList.add("hidden");
          document.getElementById("map2d").classList.remove("hidden");

          leafletMap.invalidateSize();
          leafletMap.setView([center.lat, center.lng], Math.round(zoom + 1));
          is3DActive = false;
        }
        currentBaseLayer = selected;
        set2DTileLayer();
      }
    });
  });

  // ---------------------------------------------------------------------
  // FIX: Deterministic-string hashing (djb2 mod 360) clusters colors
  // whenever device IDs are similar or sequential — that's what produced
  // the all-green pin-up in your screenshot. Golden-angle stepping by
  // ORDER OF FIRST APPEARANCE guarantees maximum hue separation between
  // whichever devices actually show up, regardless of what their IDs
  // look like. Colors are still deterministic for the session because
  // we cache the assignment per deviceId the first time we see it.
  // ---------------------------------------------------------------------
  const GOLDEN_ANGLE = 137.50776405; // degrees
  let deviceColorIndex = 0;
  const deviceColorCache = new Map();

  function getDeviceColor(deviceId) {
    if (!deviceColorCache.has(deviceId)) {
      const hue = Math.round((deviceColorIndex * GOLDEN_ANGLE) % 360);
      deviceColorIndex += 1;
      deviceColorCache.set(deviceId, {
        main: `hsl(${hue}, 72%, 50%)`,
        light: `hsl(${hue}, 85%, 65%)`,
        shadow: `hsla(${hue}, 72%, 50%, 0.45)`
      });
    }
    return deviceColorCache.get(deviceId);
  }

  // Factory function to generate device-colored hover pin DOM
  function createHoverPinElement(deviceId, isSelf = false) {
    const colors = isSelf
      ? { main: "#3B82F6", light: "#60A5FA", shadow: "rgba(59, 130, 246, 0.45)" }
      : getDeviceColor(deviceId);

    const wrapper = document.createElement('div');
    wrapper.className = 'hover-pin-wrapper';

    wrapper.style.setProperty('--pin-color', colors.main);
    wrapper.style.setProperty('--pin-color-light', colors.light);
    wrapper.style.setProperty('--pin-shadow', colors.shadow);

    wrapper.innerHTML = `
      <div class="pin-label">${isSelf ? "you" : deviceId}</div>
      <div class="pin-floating-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="10" r="3"/>
          <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/>
        </svg>
      </div>
      <div class="pin-tether"></div>
      <div class="pin-ground-shadow"></div>
    `;
    return wrapper;
  }

  // Device Telemetry State
  const devices = new Map(); // deviceId -> { marker2d, polyline2d, marker3d, trail, lastPoint, lastSeen, color }
  let selectedDevice = null;
  let hasFramedFirstPoint = false;

  function timeAgo(ts) {
    const s = Math.floor(Math.max(0, Date.now() - new Date(ts).getTime()) / 1000);
    if (s < 5) return "just now";
    if (s < 60) return `${s}s ago`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ago`;
    return `${Math.floor(m / 60)}h ago`;
  }

  function upsertDevice(point) {
    const { deviceId, lat, lng, recordedAt } = point;
    const latlng = [lat, lng];
    let d = devices.get(deviceId);

    if (!d) {
      const colors = getDeviceColor(deviceId);

      const pinIcon = L.divIcon({
        className: '',
        html: createHoverPinElement(deviceId, false).outerHTML,
        iconSize: [44, 64],
        iconAnchor: [22, 64]
      });
      const marker2d = L.marker(latlng, { icon: pinIcon }).addTo(leafletMap);
      const polyline2d = L.polyline([latlng], { color: colors.main, weight: 3, opacity: 0.75 }).addTo(leafletMap);

      const marker3d = new maplibregl.Marker({
        element: createHoverPinElement(deviceId, false),
        anchor: 'bottom'
      }).setLngLat([lng, lat]).addTo(maplibreMap);

      d = { marker2d, polyline2d, marker3d, trail: [latlng], lastPoint: point, lastSeen: recordedAt || Date.now(), color: colors.main };
      devices.set(deviceId, d);
    } else {
      d.marker2d.setLatLng(latlng);
      d.marker3d.setLngLat([lng, lat]);
      d.trail.push(latlng);
      if (d.trail.length > 200) d.trail.shift();
      d.polyline2d.setLatLngs(d.trail);
      d.lastPoint = point;
      d.lastSeen = recordedAt || Date.now();
    }

    if (!hasFramedFirstPoint) {
      leafletMap.setView(latlng, 15);
      maplibreMap.setCenter([lng, lat]);
      hasFramedFirstPoint = true;
    } else if (selectedDevice === deviceId) {
      if (is3DActive) maplibreMap.panTo([lng, lat]);
      else leafletMap.panTo(latlng);
    }
    renderDeviceList();
  }

  function sync3DMarkers() {
    for (const [_, d] of devices) {
      d.marker3d.setLngLat([d.lastPoint.lng, d.lastPoint.lat]);
    }
  }

  function renderDeviceList() {
    const list = document.getElementById("deviceList");
    if (devices.size === 0) {
      list.innerHTML = `<div class="px-4 py-7 text-center text-[12px] text-gray-400 dark:text-gray-500 leading-relaxed">Waiting for the first location report&hellip;</div>`;
      return;
    }
    list.innerHTML = "";
    for (const [deviceId, d] of devices) {
      const row = document.createElement("div");
      const selected = selectedDevice === deviceId;
      row.className = `px-4 py-3 border-b border-hairline-light dark:border-hairline-dark last:border-b-0 cursor-pointer transition-colors hover:bg-gray-50 dark:hover:bg-white/5 ${selected ? "bg-gray-50 dark:bg-white/5 shadow-[inset_2px_0_0_var(--device-color)]" : ""}`;
      row.style.setProperty('--device-color', d.color);

      row.innerHTML = `
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full shadow-sm" style="background-color: ${d.color}"></span>
            <span class="text-[12px] font-medium font-mono">${deviceId}</span>
          </div>
          <span class="text-[10px] text-gray-400 dark:text-gray-500">${timeAgo(d.lastSeen)}</span>
        </div>
        <div class="flex gap-3 text-[11px] font-mono text-gray-500 dark:text-gray-400 pl-4">
          <span>lat <b class="text-[#111318] dark:text-[#E7E9EE] font-medium">${d.lastPoint.lat.toFixed(5)}</b></span>
          <span>lng <b class="text-[#111318] dark:text-[#E7E9EE] font-medium">${d.lastPoint.lng.toFixed(5)}</b></span>
        </div>`;
      row.addEventListener("click", () => {
        selectedDevice = deviceId;
        if (is3DActive) maplibreMap.panTo([d.lastPoint.lng, d.lastPoint.lat]);
        else leafletMap.panTo(d.marker2d.getLatLng());
        renderDeviceList();
      });
      list.appendChild(row);
    }
  }
  setInterval(renderDeviceList, 10000);

  // Self Geolocation Tracker
  const selfDeviceId = `browser-${Math.random().toString(36).slice(2, 8)}`;
  let geoWatchId = null;
  let selfMarker2d = null, selfAccuracy2d = null, selfMarker3d = null;

  function updateSelfPosition(coords) {
    const latlng = [coords.latitude, coords.longitude];

    if (!selfMarker2d) {
      const pinIcon = L.divIcon({
        className: '',
        html: createHoverPinElement(selfDeviceId, true).outerHTML,
        iconSize: [44, 64],
        iconAnchor: [22, 64]
      });
      selfMarker2d = L.marker(latlng, { icon: pinIcon, zIndexOffset: 1000 }).addTo(leafletMap);
      selfAccuracy2d = L.circle(latlng, { radius: coords.accuracy, color: "#3B82F6", weight: 1, fillColor: "#3B82F6", fillOpacity: 0.08 }).addTo(leafletMap);

      selfMarker3d = new maplibregl.Marker({
        element: createHoverPinElement(selfDeviceId, true),
        anchor: 'bottom'
      }).setLngLat([coords.longitude, coords.latitude]).addTo(maplibreMap);

      if (!is3DActive) leafletMap.setView(latlng, 16);
    } else {
      selfMarker2d.setLatLng(latlng);
      selfAccuracy2d.setLatLng(latlng).setRadius(coords.accuracy);
      selfMarker3d.setLngLat([coords.longitude, coords.latitude]);
    }

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ deviceId: selfDeviceId, lat: coords.latitude, lng: coords.longitude }),
    }).catch(() => {});
  }

  function startSharing() {
    if (!navigator.geolocation) return alert("Geolocation unsupported.");
    geoWatchId = navigator.geolocation.watchPosition(
      (pos) => updateSelfPosition(pos.coords),
      (err) => console.warn("Geo Error:", err.message),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
    document.getElementById("locateBtn").classList.add("text-blue-500");
  }

  function stopSharing() {
    if (geoWatchId !== null) navigator.geolocation.clearWatch(geoWatchId);
    geoWatchId = null;
    if (selfMarker2d) {
      leafletMap.removeLayer(selfMarker2d);
      leafletMap.removeLayer(selfAccuracy2d);
      selfMarker3d.remove();
      selfMarker2d = selfAccuracy2d = selfMarker3d = null;
    }
    document.getElementById("locateBtn").classList.remove("text-blue-500");
  }

  document.getElementById("locateBtn").addEventListener("click", () => {
    geoWatchId === null ? startSharing() : stopSharing();
  });

  // WebSocket Telemetry Connection
  let reconnectDelay = RECONNECT_BASE_MS;

  function setStatus(state, label, dotClass) {
    const pill = document.getElementById("statusPill");
    const dot = document.getElementById("statusDot");
    const colors = {
      connecting: "text-amber-500 border-amber-500/30",
      connected: "text-emerald-500 border-emerald-500/30",
      disconnected: "text-red-500 border-red-500/30",
    };
    pill.className = `flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full border ${colors[state]}`;
    dot.className = `w-1.5 h-1.5 rounded-full ${dotClass}`;
    document.getElementById("statusText").textContent = label;
  }

  function connect() {
    setStatus("connecting", "Connecting", "bg-amber-500 blink");
    const socket = new WebSocket(WS_URL);

    socket.addEventListener("open", () => {
      setStatus("connected", "Live", "bg-emerald-500");
      reconnectDelay = RECONNECT_BASE_MS;
    });

    socket.addEventListener("message", (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === "location_update" && msg.point) {
          if (msg.point.deviceId === selfDeviceId) return;
          upsertDevice(msg.point);
        }
      } catch (_) {}
    });

    socket.addEventListener("close", () => {
      setStatus("disconnected", "Reconnecting", "bg-red-500");
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.6, RECONNECT_MAX_MS);
    });

    socket.addEventListener("error", () => socket.close());
  }
  connect();
</script>
